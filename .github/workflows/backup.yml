name: Supabase weekly backup

on:
  # 每週日 00:00（Asia/Taipei）；GitHub Actions cron 使用 UTC。
  schedule:
    - cron: '0 16 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-weekly-backup
  cancel-in-progress: false

jobs:
  backup-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BACKUP_EMAIL_TO: ${{ secrets.BACKUP_EMAIL_TO }}
          BACKUP_EMAIL_FROM: ${{ secrets.BACKUP_EMAIL_FROM }}
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_DB_URL SMTP_SERVER SMTP_PORT SMTP_SECURE SMTP_USERNAME SMTP_PASSWORD BACKUP_EMAIL_TO BACKUP_EMAIL_FROM; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Export public schema and data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p backups
          BACKUP_FILE="supabase-public-$(date -u +'%Y%m%dT%H%M%SZ')-run-${GITHUB_RUN_ID}.sql"
          echo "BACKUP_PATH=backups/${BACKUP_FILE}" >> "$GITHUB_ENV"

          docker run --rm \
            -v "$PWD/backups:/backup" \
            -e SUPABASE_DB_URL \
            -e BACKUP_FILE="$BACKUP_FILE" \
            postgres:17-alpine \
            sh -c 'pg_dump "$SUPABASE_DB_URL" \
              --schema=public \
              --format=plain \
              --no-owner \
              --no-privileges \
              --file="/backup/$BACKUP_FILE"'

          test -s "backups/${BACKUP_FILE}"
          sha256sum "backups/${BACKUP_FILE}" > "backups/${BACKUP_FILE}.sha256"

      - name: Email SQL backup
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BACKUP_EMAIL_TO: ${{ secrets.BACKUP_EMAIL_TO }}
          BACKUP_EMAIL_FROM: ${{ secrets.BACKUP_EMAIL_FROM }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import mimetypes
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage
          from pathlib import Path

          message = EmailMessage()
          message["Subject"] = "Salon Management System｜Supabase 每週備份"
          message["From"] = os.environ["BACKUP_EMAIL_FROM"]
          message["To"] = os.environ["BACKUP_EMAIL_TO"]
          message.set_content(
              "Supabase public schema 的結構與資料備份已完成。\n"
              f"Repository: {os.environ['REPOSITORY']}\n"
              f"Workflow run: {os.environ['RUN_URL']}\n"
          )

          for filename in (os.environ["BACKUP_PATH"], os.environ["BACKUP_PATH"] + ".sha256"):
              path = Path(filename)
              content_type, _ = mimetypes.guess_type(path.name)
              maintype, subtype = (content_type or "application/octet-stream").split("/", 1)
              message.add_attachment(path.read_bytes(), maintype=maintype, subtype=subtype, filename=path.name)

          server = os.environ["SMTP_SERVER"]
          port = int(os.environ["SMTP_PORT"])
          context = ssl.create_default_context()
          if os.environ["SMTP_SECURE"].lower() in {"1", "true", "yes"}:
              smtp = smtplib.SMTP_SSL(server, port, context=context)
          else:
              smtp = smtplib.SMTP(server, port)
              smtp.starttls(context=context)

          with smtp:
              smtp.login(os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"])
              smtp.send_message(message)
          PY
